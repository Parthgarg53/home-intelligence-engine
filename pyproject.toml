
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-intelligence-engine"
version = "0.1.0"
description = "A lifecycle-aware smart-home intent engine"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["openai>=2.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
